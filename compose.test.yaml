services:
  api:
    environment:
      PROCUREMENT_LOG_LEVEL: ERROR
      PROCUREMENT_MCP_CLIENT_TIMEOUT_SECONDS: "1"

  mcp:
    environment:
      PROCUREMENT_LOG_LEVEL: ERROR
      PROCUREMENT_MCP_READ_TIMEOUT_SECONDS: "0.2"
      PROCUREMENT_MCP_RETRY_DELAY_SECONDS: "0"

  fake-odoo:
    environment:
      PROCUREMENT_FAKE_ODOO_SCENARIO: ${PROCUREMENT_FAKE_ODOO_SCENARIO:-success}
      PROCUREMENT_FAKE_ODOO_TIMEOUT_SECONDS: "1"
