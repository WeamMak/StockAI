apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

transformers:
  - namespace-transformer.yaml
  - observability/logging-namespace-transformer.yaml

patches:
  - path: environment-config.yaml
  - path: external-secrets.yaml
  - path: storage-coordinates.yaml
  - path: observability/environment.yaml
  - path: namespace.yaml
    target:
      kind: Namespace
      name: stockai
  - path: observability/logging-namespace.yaml
    target:
      kind: Namespace
      name: stockai-logs

images:
  # T22 promotes the same dev-validated published digests into this map.
  # These sentinels deliberately cannot identify a mutable image tag.
  - name: stockai/frontend
    newName: docker.io/weammak/stockai-frontend
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  - name: stockai/api
    newName: docker.io/weammak/stockai-api
    digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
  - name: stockai/mcp
    newName: docker.io/weammak/stockai-mcp
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  - name: stockai/odoo
    newName: docker.io/weammak/stockai-odoo
    digest: sha256:4444444444444444444444444444444444444444444444444444444444444444

replacements:
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.PROCUREMENT_ENVIRONMENT
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.nodeSelector.[stockai.io/environment]
          - spec.template.spec.tolerations.0.value
      - select:
          kind: Job
        fieldPaths:
          - spec.template.spec.nodeSelector.[stockai.io/environment]
          - spec.template.spec.tolerations.0.value
      - select:
          kind: CronJob
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.nodeSelector.[stockai.io/environment]
          - spec.jobTemplate.spec.template.spec.tolerations.0.value
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.STOCKAI_APPLICATION_HOST
    targets:
      - select:
          kind: Ingress
          name: stockai-public
        fieldPaths:
          - spec.rules.0.host
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.STOCKAI_ODOO_HOST
    targets:
      - select:
          kind: Ingress
          name: stockai-public
        fieldPaths:
          - spec.rules.1.host
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.STOCKAI_GRAFANA_HOST
    targets:
      - select:
          kind: Ingress
          name: stockai-public
        fieldPaths:
          - spec.rules.2.host
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.odooVolumeHandle
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-odoo-filestore
        fieldPaths:
          - spec.csi.volumeHandle
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.postgresqlVolumeHandle
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-postgresql-data
        fieldPaths:
          - spec.csi.volumeHandle
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.prometheusVolumeHandle
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-prometheus-data
        fieldPaths:
          - spec.csi.volumeHandle
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.availabilityZone
    targets:
      - select:
          kind: PersistentVolume
        fieldPaths:
          - spec.nodeAffinity.required.nodeSelectorTerms.0.matchExpressions.0.values.0
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.environment
    targets:
      - select:
          kind: PersistentVolume
        fieldPaths:
          - spec.claimRef.namespace
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.odooPersistentVolume
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-odoo-filestore
        fieldPaths:
          - metadata.name
      - select:
          kind: PersistentVolumeClaim
          name: odoo-filestore
        fieldPaths:
          - spec.volumeName
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.postgresqlPersistentVolume
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-postgresql-data
        fieldPaths:
          - metadata.name
      - select:
          kind: PersistentVolumeClaim
          name: postgresql-data
        fieldPaths:
          - spec.volumeName
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.prometheusPersistentVolume
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-prometheus-data
        fieldPaths:
          - metadata.name
      - select:
          kind: PersistentVolumeClaim
          name: prometheus-data
        fieldPaths:
          - spec.volumeName
