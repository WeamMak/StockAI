apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

transformers:
  - namespace-transformer.yaml
  - observability/logging-namespace-transformer.yaml

patches:
  - path: environment-config.yaml
  - path: external-secrets.yaml
  - path: storage-coordinates.yaml
  - path: observability/environment.yaml
  - path: namespace.yaml
    target:
      kind: Namespace
      name: stockai
  - path: observability/logging-namespace.yaml
    target:
      kind: Namespace
      name: stockai-logs

images:
  # T22 replaces these sentinel digests with published Docker Hub digests
  # before Argo CD is allowed to reconcile the application workloads.
  - name: stockai/frontend
    newName: docker.io/weammakhoul/stockai-frontend
    digest: sha256:9e800037d598c8044684901251304a13f950bebeafc840be20838c8259f8509a
  - name: stockai/api
    newName: docker.io/weammakhoul/stockai-api
    digest: sha256:2d500f44cce258e79212cc89774e04844909b68a7cffc23e4cf980ecc9a026e9
  - name: stockai/mcp
    newName: docker.io/weammakhoul/stockai-mcp
    digest: sha256:23d650c3be2403a43c023eb338dc9772a0f1347d6a27d86faa37b261f362b1e7
  - name: stockai/odoo
    newName: docker.io/weammakhoul/stockai-odoo
    digest: sha256:663e1d6387598ac79aee5b7655caa4fd0b7bf2e057090ad7c90e560aee8a1cd9

replacements:
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.PROCUREMENT_ENVIRONMENT
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.nodeSelector.[stockai.io/environment]
          - spec.template.spec.tolerations.0.value
      - select:
          kind: Job
        fieldPaths:
          - spec.template.spec.nodeSelector.[stockai.io/environment]
          - spec.template.spec.tolerations.0.value
      - select:
          kind: CronJob
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.nodeSelector.[stockai.io/environment]
          - spec.jobTemplate.spec.template.spec.tolerations.0.value
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.STOCKAI_APPLICATION_HOST
    targets:
      - select:
          kind: Ingress
          name: stockai-public
        fieldPaths:
          - spec.rules.0.host
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.STOCKAI_ODOO_HOST
    targets:
      - select:
          kind: Ingress
          name: stockai-public
        fieldPaths:
          - spec.rules.1.host
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.STOCKAI_GRAFANA_HOST
    targets:
      - select:
          kind: Ingress
          name: stockai-public
        fieldPaths:
          - spec.rules.2.host
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.odooVolumeHandle
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-odoo-filestore
        fieldPaths:
          - spec.csi.volumeHandle
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.postgresqlVolumeHandle
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-postgresql-data
        fieldPaths:
          - spec.csi.volumeHandle
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.prometheusVolumeHandle
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-prometheus-data
        fieldPaths:
          - spec.csi.volumeHandle
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.availabilityZone
    targets:
      - select:
          kind: PersistentVolume
        fieldPaths:
          - spec.nodeAffinity.required.nodeSelectorTerms.0.matchExpressions.0.values.0
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.environment
    targets:
      - select:
          kind: PersistentVolume
        fieldPaths:
          - spec.claimRef.namespace
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.odooPersistentVolume
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-odoo-filestore
        fieldPaths:
          - metadata.name
      - select:
          kind: PersistentVolumeClaim
          name: odoo-filestore
        fieldPaths:
          - spec.volumeName
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.postgresqlPersistentVolume
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-postgresql-data
        fieldPaths:
          - metadata.name
      - select:
          kind: PersistentVolumeClaim
          name: postgresql-data
        fieldPaths:
          - spec.volumeName
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.prometheusPersistentVolume
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-prometheus-data
        fieldPaths:
          - metadata.name
      - select:
          kind: PersistentVolumeClaim
          name: prometheus-data
        fieldPaths:
          - spec.volumeName
