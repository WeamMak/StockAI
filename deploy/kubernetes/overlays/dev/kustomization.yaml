apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

transformers:
  - namespace-transformer.yaml
  - observability/logging-namespace-transformer.yaml

patches:
  - path: environment-config.yaml
  - path: external-secrets.yaml
  - path: storage-coordinates.yaml
  - path: observability/environment.yaml
  - path: namespace.yaml
    target:
      kind: Namespace
      name: stockai
  - path: observability/logging-namespace.yaml
    target:
      kind: Namespace
      name: stockai-logs

images:
  # T22 replaces these sentinel digests with published Docker Hub digests
  # before Argo CD is allowed to reconcile the application workloads.
  - name: stockai/frontend
    newName: docker.io/weammakhoul/stockai-frontend
    digest: sha256:db7991435d502b61cc3c088b46704df0ad0fa8f19d0d33bf54d5f738d1b192a3
  - name: stockai/api
    newName: docker.io/weammakhoul/stockai-api
    digest: sha256:e8b386e3c0db974ea0e04abd0ac28b6af2c1ddaf740648a799a9ac75ff9b2221
  - name: stockai/mcp
    newName: docker.io/weammakhoul/stockai-mcp
    digest: sha256:27c368a7a1bfa969aa08d485f1f5dc4ada930b50300810f20cc2447037b505cc
  - name: stockai/odoo
    newName: docker.io/weammakhoul/stockai-odoo
    digest: sha256:61050671c7ae00a86029206314f805204f71e09dcc6a007b6e60ac4b5d341b3c

replacements:
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.PROCUREMENT_ENVIRONMENT
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.nodeSelector.[stockai.io/environment]
          - spec.template.spec.tolerations.0.value
      - select:
          kind: Job
        fieldPaths:
          - spec.template.spec.nodeSelector.[stockai.io/environment]
          - spec.template.spec.tolerations.0.value
      - select:
          kind: CronJob
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.nodeSelector.[stockai.io/environment]
          - spec.jobTemplate.spec.template.spec.tolerations.0.value
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.STOCKAI_APPLICATION_HOST
    targets:
      - select:
          kind: Ingress
          name: stockai-public
        fieldPaths:
          - spec.rules.0.host
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.STOCKAI_ODOO_HOST
    targets:
      - select:
          kind: Ingress
          name: stockai-public
        fieldPaths:
          - spec.rules.1.host
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.STOCKAI_GRAFANA_HOST
    targets:
      - select:
          kind: Ingress
          name: stockai-public
        fieldPaths:
          - spec.rules.2.host
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.odooVolumeHandle
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-odoo-filestore
        fieldPaths:
          - spec.csi.volumeHandle
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.postgresqlVolumeHandle
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-postgresql-data
        fieldPaths:
          - spec.csi.volumeHandle
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.prometheusVolumeHandle
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-prometheus-data
        fieldPaths:
          - spec.csi.volumeHandle
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.availabilityZone
    targets:
      - select:
          kind: PersistentVolume
        fieldPaths:
          - spec.nodeAffinity.required.nodeSelectorTerms.0.matchExpressions.0.values.0
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.environment
    targets:
      - select:
          kind: PersistentVolume
        fieldPaths:
          - spec.claimRef.namespace
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.odooPersistentVolume
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-odoo-filestore
        fieldPaths:
          - metadata.name
      - select:
          kind: PersistentVolumeClaim
          name: odoo-filestore
        fieldPaths:
          - spec.volumeName
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.postgresqlPersistentVolume
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-postgresql-data
        fieldPaths:
          - metadata.name
      - select:
          kind: PersistentVolumeClaim
          name: postgresql-data
        fieldPaths:
          - spec.volumeName
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.prometheusPersistentVolume
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-prometheus-data
        fieldPaths:
          - metadata.name
      - select:
          kind: PersistentVolumeClaim
          name: prometheus-data
        fieldPaths:
          - spec.volumeName
