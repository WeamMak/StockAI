apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

transformers:
  - namespace-transformer.yaml
  - observability/logging-namespace-transformer.yaml

patches:
  - path: environment-config.yaml
  - path: external-secrets.yaml
  - path: storage-coordinates.yaml
  - path: observability/environment.yaml
  - path: namespace.yaml
    target:
      kind: Namespace
      name: stockai
  - path: observability/logging-namespace.yaml
    target:
      kind: Namespace
      name: stockai-logs

images:
  # T22 replaces these sentinel digests with published Docker Hub digests
  # before Argo CD is allowed to reconcile the application workloads.
  - name: stockai/frontend
    newName: docker.io/weammakhoul/stockai-frontend
    digest: sha256:7186056ea42c16ccec16b1ef0015e9688e1fd7b522c9ef378ff431f62142f84b
  - name: stockai/api
    newName: docker.io/weammakhoul/stockai-api
    digest: sha256:9f11118028a43bf034a0b453ebdc5fcf19ce4048dfb007e9272e58f82a666dea
  - name: stockai/mcp
    newName: docker.io/weammakhoul/stockai-mcp
    digest: sha256:0b5b4cc69c9ec27bc5fdae5036fd192e8aa606d579910c9094ecfd92f578a97b
  - name: stockai/odoo
    newName: docker.io/weammakhoul/stockai-odoo
    digest: sha256:a58c7ffa489f9676cbd3982afbd32c15b520131709ad63e15b5c6f3383d1e3d8

replacements:
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.PROCUREMENT_ENVIRONMENT
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.nodeSelector.[stockai.io/environment]
          - spec.template.spec.tolerations.0.value
      - select:
          kind: Job
        fieldPaths:
          - spec.template.spec.nodeSelector.[stockai.io/environment]
          - spec.template.spec.tolerations.0.value
      - select:
          kind: CronJob
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.nodeSelector.[stockai.io/environment]
          - spec.jobTemplate.spec.template.spec.tolerations.0.value
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.STOCKAI_APPLICATION_HOST
    targets:
      - select:
          kind: Ingress
          name: stockai-public
        fieldPaths:
          - spec.rules.0.host
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.STOCKAI_ODOO_HOST
    targets:
      - select:
          kind: Ingress
          name: stockai-public
        fieldPaths:
          - spec.rules.1.host
  - source:
      kind: ConfigMap
      name: stockai-environment
      fieldPath: data.STOCKAI_GRAFANA_HOST
    targets:
      - select:
          kind: Ingress
          name: stockai-public
        fieldPaths:
          - spec.rules.2.host
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.odooVolumeHandle
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-odoo-filestore
        fieldPaths:
          - spec.csi.volumeHandle
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.postgresqlVolumeHandle
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-postgresql-data
        fieldPaths:
          - spec.csi.volumeHandle
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.prometheusVolumeHandle
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-prometheus-data
        fieldPaths:
          - spec.csi.volumeHandle
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.availabilityZone
    targets:
      - select:
          kind: PersistentVolume
        fieldPaths:
          - spec.nodeAffinity.required.nodeSelectorTerms.0.matchExpressions.0.values.0
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.environment
    targets:
      - select:
          kind: PersistentVolume
        fieldPaths:
          - spec.claimRef.namespace
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.odooPersistentVolume
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-odoo-filestore
        fieldPaths:
          - metadata.name
      - select:
          kind: PersistentVolumeClaim
          name: odoo-filestore
        fieldPaths:
          - spec.volumeName
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.postgresqlPersistentVolume
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-postgresql-data
        fieldPaths:
          - metadata.name
      - select:
          kind: PersistentVolumeClaim
          name: postgresql-data
        fieldPaths:
          - spec.volumeName
  - source:
      kind: ConfigMap
      name: stockai-storage-coordinates
      fieldPath: data.prometheusPersistentVolume
    targets:
      - select:
          kind: PersistentVolume
          name: stockai-prometheus-data
        fieldPaths:
          - metadata.name
      - select:
          kind: PersistentVolumeClaim
          name: prometheus-data
        fieldPaths:
          - spec.volumeName
