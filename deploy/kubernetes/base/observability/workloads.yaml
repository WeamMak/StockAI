apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockai-external-secrets
  labels: &external-secrets-labels
    app.kubernetes.io/name: stockai-external-secrets
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: stockai
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stockai-external-secrets
  template:
    metadata:
      labels: *external-secrets-labels
    spec:
      serviceAccountName: stockai-external-secrets
      automountServiceAccountToken: true
      nodeSelector:
        stockai.io/environment: stockai
      tolerations:
        - key: stockai.io/environment
          operator: Equal
          value: stockai
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: external-secrets
          image: ghcr.io/external-secrets/external-secrets:v2.8.0
          imagePullPolicy: IfNotPresent
          args:
            - --namespace=stockai
            - --controller-class=stockai-stockai
            - --enable-cluster-store-reconciler=false
            - --enable-cluster-external-secret-reconciler=false
            - --enable-cluster-push-secret-reconciler=false
            - --enable-push-secret-reconciler=false
            - --metrics-addr=:8080
            - --live-addr=:8081
            - --loglevel=info
            - --concurrent=2
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: live
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 192Mi
          startupProbe: &external-secrets-probe
            httpGet:
              path: /healthz
              port: live
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            <<: *external-secrets-probe
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: live
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
