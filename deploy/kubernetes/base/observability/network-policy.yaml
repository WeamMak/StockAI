apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stockai-prometheus
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-grafana
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - stockai-agent-api
                  - stockai-procurement-mcp
                  - stockai-alertmanager
                  - stockai-blackbox-exporter
                  - stockai-external-secrets
                  - stockai-loki
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9115
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 3100
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-application-metrics
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [stockai-agent-api, stockai-procurement-mcp]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-prometheus
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stockai-grafana
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [stockai-prometheus, stockai-loki]
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 3100
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loki
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stockai-loki
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [stockai-grafana, stockai-prometheus]
        - namespaceSelector:
            matchLabels:
              stockai.io/log-environment: stockai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-fluent-bit
      ports:
        - protocol: TCP
          port: 3100
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
---
