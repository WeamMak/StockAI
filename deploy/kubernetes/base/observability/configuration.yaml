apiVersion: v1
kind: ConfigMap
metadata:
  name: stockai-observability-config
  labels:
    app.kubernetes.io/part-of: stockai
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
      evaluation_interval: 30s
      external_labels:
        project: stockai
    alerting:
      alertmanagers:
        - static_configs:
            - targets: [alertmanager:9093]
    rule_files:
      - /etc/prometheus/rules/*.yaml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
      - job_name: stockai-agent-api
        metrics_path: /metrics
        dns_sd_configs:
          - names: [api-metrics]
            type: A
            port: 8000
            refresh_interval: 30s
      - job_name: stockai-procurement-mcp
        metrics_path: /metrics
        dns_sd_configs:
          - names: [procurement-mcp-metrics]
            type: A
            port: 9000
            refresh_interval: 30s
      - job_name: stockai-observability
        static_configs:
          - targets:
              - alertmanager:9093
              - blackbox-exporter:9115
              - loki:3100
              - external-secrets-metrics:8080
      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics.kube-system.svc.cluster.local:8080]
      - job_name: public-https
        metrics_path: /probe
        params:
          module: [https_2xx]
        file_sd_configs:
          - files: [/etc/prometheus/targets/blackbox-targets.yaml]
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
  alertmanager.yml: |
    route:
      receiver: internal-only
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: internal-only
  blackbox.yml: |
    modules:
      https_2xx:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          fail_if_not_ssl: true
          follow_redirects: true
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      log_level: info
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        s3:
          bucketnames: ${LOKI_S3_BUCKET}
          region: ${AWS_REGION}
          s3forcepathstyle: false
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      object_prefix: ${LOKI_S3_PREFIX}
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache
    ingester:
      wal:
        enabled: true
        dir: /var/loki/wal
        replay_memory_ceiling: 128MB
        flush_on_shutdown: true
    compactor:
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      delete_request_store: s3
      retention_delete_delay: 2h
      retention_delete_worker_count: 2
    limits_config:
      retention_period: ${LOKI_RETENTION_PERIOD}
      ingestion_rate_mb: 2
      ingestion_burst_size_mb: 4
      max_global_streams_per_user: 1000
      reject_old_samples: true
      reject_old_samples_max_age: 24h
    analytics:
      reporting_enabled: false
  grafana.ini: |
    [analytics]
    reporting_enabled = false
    check_for_updates = false
    [auth.anonymous]
    enabled = false
    [security]
    disable_initial_admin_creation = false
    [users]
    allow_sign_up = false
    [paths]
    provisioning = /etc/grafana/provisioning
  datasources.yaml: |
    apiVersion: 1
    prune: true
    datasources:
      - name: Prometheus
        uid: stockai-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: stockai-loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
      - name: CloudWatch
        uid: stockai-cloudwatch
        type: cloudwatch
        editable: false
        jsonData:
          authType: default
          defaultRegion: us-east-1
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: stockai
        orgId: 1
        folder: StockAI
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stockai-observability-environment
  labels:
    app.kubernetes.io/part-of: stockai
data:
  ENVIRONMENT: stockai
  AWS_REGION: us-east-1
  LOKI_S3_BUCKET: replace-after-edge-terraform-apply
  LOKI_S3_PREFIX: stockai/
  LOKI_RETENTION_PERIOD: 336h
  blackbox-targets.yaml: |
    - targets:
        - https://app.stockai.stockai.fursa.click
        - https://odoo.stockai.stockai.fursa.click
        - https://grafana.stockai.stockai.fursa.click
      labels:
        environment: stockai
