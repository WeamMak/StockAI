apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  provider:
    aws:
      region: us-east-1
      service: SecretsManager
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cron-token
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  data:
    - remoteRef:
        key: weam-stockai/stockai/cron-token
      secretKey: value
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: cron-token
---
