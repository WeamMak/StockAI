apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockai-frontend
  labels: &frontend-labels
    app.kubernetes.io/name: stockai-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: stockai
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: stockai-frontend
  template:
    metadata:
      labels: *frontend-labels
    spec:
      serviceAccountName: stockai-frontend
      automountServiceAccountToken: false
      nodeSelector:
        stockai.io/environment: stockai
      tolerations:
        - key: stockai.io/environment
          operator: Equal
          value: stockai
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      containers:
        - name: frontend
          image: stockai/frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          startupProbe: &frontend-probe
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            <<: *frontend-probe
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            <<: *frontend-probe
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockai-agent-api
  labels: &api-labels
    app.kubernetes.io/name: stockai-agent-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: stockai
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: stockai-agent-api
  template:
    metadata:
      labels: *api-labels
    spec:
      serviceAccountName: stockai-agent-api
      automountServiceAccountToken: false
      nodeSelector:
        stockai.io/environment: stockai
      tolerations:
        - key: stockai.io/environment
          operator: Equal
          value: stockai
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: stockai/api
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: stockai-environment
          env:
            - name: PROCUREMENT_CRON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cron-token
                  key: value
            - name: PROCUREMENT_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-token
                  key: value
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
