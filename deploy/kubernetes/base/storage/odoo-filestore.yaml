apiVersion: v1
kind: PersistentVolume
metadata:
  name: stockai-odoo-filestore
  labels:
    app.kubernetes.io/component: odoo
    app.kubernetes.io/part-of: stockai
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 5Gi
  claimRef:
    name: odoo-filestore
    namespace: stockai
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-placeholder-odoo
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.kubernetes.io/zone
              operator: In
              values:
                - us-east-1a
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-filestore
  labels:
    app.kubernetes.io/component: odoo
    app.kubernetes.io/part-of: stockai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ""
  volumeMode: Filesystem
  volumeName: stockai-odoo-filestore
