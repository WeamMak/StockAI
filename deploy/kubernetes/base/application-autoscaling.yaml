apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stockai-frontend-cpu
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stockai-frontend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
