apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stockai-frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-agent-api
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stockai-agent-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-frontend
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-procurement-mcp
      ports:
        - protocol: TCP
          port: 9000
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cron-to-api
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stockai-agent-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-daily-scan
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stockai-procurement-mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-agent-api
      ports:
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-odoo
      ports:
        - protocol: TCP
          port: 8069
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-odoo
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stockai-odoo
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-procurement-mcp
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8069
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-postgresql
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stockai-postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [stockai-odoo, stockai-odoo-bootstrap]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-automation-egress
  labels:
    app.kubernetes.io/part-of: stockai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: automation
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-agent-api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stockai-postgresql
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
