apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockai-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WeamMak/StockAI.git
    targetRevision: main
    path: deploy/kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: stockai-prod
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: stockai-frontend
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: stockai-agent-api
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: stockai-procurement-mcp
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
