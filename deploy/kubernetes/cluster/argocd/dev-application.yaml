apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockai-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WeamMak/StockAI.git
    targetRevision: dev
    path: deploy/kubernetes/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: stockai-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
