[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "stockai-procurement"
version = "0.1.0"
description = "Approval-gated AI procurement agent for self-hosted Odoo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.43.62",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langgraph==1.2.10",
  "mcp==1.29.0",
  "prometheus-client==0.25.0",
  "pydantic==2.13.4",
  "uvicorn==0.52.1",
]

[project.scripts]
stockai-api = "procurement.bootstrap.api:run"
stockai-mcp = "procurement.bootstrap.mcp:run"

[dependency-groups]
dev = [
  "httpx2==2.7.0",
  "mypy==1.20.2",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/procurement"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src/procurement"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
